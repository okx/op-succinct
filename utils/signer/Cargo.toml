[package]
name = "op-succinct-signer-utils"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]

# alloy
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rpc-types-eth = { workspace = true, features = ["k256"] }
alloy-signer.workspace = true
alloy-signer-local.workspace = true
alloy-signer-gcp.workspace = true
alloy-transport-http.workspace = true

# general
anyhow.workspace = true
tokio.workspace = true
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "aws-lc-rs",
] }
gcloud-sdk.workspace = true

# kms
ok-kms-rust = { workspace = true, optional = true }

# xlayer remote signer dependencies
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
tracing.workspace = true
thiserror.workspace = true
aes.workspace = true
base64.workspace = true
lru.workspace = true

# xlayer verify server (asset-management refOrderId callback endpoint)
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }

[features]
kms = ["dep:ok-kms-rust"]
# Gates the standalone refOrderId lookup HTTP server. Activated transitively by
# the `tz` feature of op-succinct-fp.
xlayer-verify = ["dep:axum", "dep:tower"]
# Carries no production code: it only widens the `cfg` on the refOrderId cache
# helpers so a companion crate's integration tests can seed and probe the cache.
# Absent from release builds.
xlayer-verify-test-utils = []

[dev-dependencies]
dotenv.workspace = true
op-succinct-host-utils.workspace = true
tower = { workspace = true, features = ["util"] }
