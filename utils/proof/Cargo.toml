[package]
name = "op-succinct-proof-utils"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]

# local
# op-succinct-celestia-host-utils excluded (not used by XLayer)
# op-succinct-eigenda-host-utils excluded (not used by XLayer)
op-succinct-elfs.workspace = true
op-succinct-ethereum-host-utils = { workspace = true, optional = true }
op-succinct-host-utils.workspace = true

# sp1
sp1-sdk.workspace = true
sp1-prover-types.workspace = true
sp1-cluster-artifact.workspace = true
sp1-cluster-common.workspace = true
sp1-cluster-utils.workspace = true

# general
anyhow.workspace = true
cfg-if.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = ["ethereum"]
# celestia/eigenda features excluded (DA backends not used by XLayer)
ethereum = ["op-succinct-ethereum-host-utils"]
