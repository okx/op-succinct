[workspace]
members = [
    "utils/client",
    "utils/host",
    "utils/build",
    # "utils/celestia/client",  # Not used by XLayer; excluded to avoid hana dependency
    # "utils/celestia/host",
    # "utils/eigenda/client",   # Not used by XLayer; excluded to avoid hokulea dependency
    # "utils/eigenda/host",
    "utils/proof",
    "utils/signer",
    "utils/ethereum/client",
    "utils/ethereum/host",
    "programs/range/ethereum",
    "programs/range/utils",
    # "programs/range/celestia",  # Not used by XLayer
    # "programs/range/eigenda",   # Not used by XLayer
    "programs/aggregation",
    "scripts/*",
    "validity",
    "fault-proof",
    "bindings",
]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2021"
authors = ["ratankaliani", "zachobront", "fakedev9999", "yuwen01"]
homepage = "https://succinctlabs.github.io/op-succinct/"
repository = "https://github.com/succinctlabs/op-succinct"
version = "4.3.0"

[workspace.dependencies]
# general
anyhow = { version = "1.0.86", default-features = false }
thiserror = { version = "2.0.3" }
cfg-if = "1.0.0"
spin = { version = "0.10.0" }
lru = "0.12.3"
async-trait = "0.1.80"
sha2 = "0.10.8"
hmac = "0.12"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1.44.2", features = ["full"] }
clap = "4.5.9"
cargo_metadata = "0.18.1"
dotenv = "0.15.0"
num-format = "0.4.4"
futures = "0.3.30"
serde_cbor = "0.11.2"
log = "0.4.22"
itertools = "0.13.0"
reqwest = { version = "0.12", features = ["json"] }
csv = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.117", default-features = false }
rkyv = { version = "0.8", features = ["hashbrown-0_15", "std"] }
hex = "0.4.3"
bincode = "1.3.3"
base64 = "0.22.1"
aes = "0.8"
tower-http = { version = "0.5.2", features = ["limit"] }
lazy_static = "1.5.0"
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "json"] }
tracing-opentelemetry = "^0.24"
opentelemetry = { version = "^0.23.0", features = ["trace"] }
opentelemetry_sdk = { version = "^0.23.0", features = [
    "trace",
    "rt-tokio",
    "logs_level_enabled",
] }
opentelemetry-stdout = { version = "0.2.0", features = ["trace"] }
opentelemetry-otlp = { version = "^0.16.0", features = ["default", "logs"] }
opentelemetry-appender-tracing = "0.4.0"

metrics = "0.24.1"
metrics-exporter-prometheus = "0.16.2"
metrics-process = "2.4.0"
strum = "0.27.1"
strum_macros = "0.27.1"
tempfile = "3.10.1"

# vergen - pin to exact versions for rollup-boost compatibility
vergen = "=9.0.4"
vergen-git2 = "=1.0.5"

# kona
kona-mpt = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
kona-derive = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }
kona-driver = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
kona-preimage = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", features = [
    "rkyv",
    "serde",
] }
kona-executor = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
kona-proof = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }

kona-client = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
kona-host = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
kona-providers-alloy = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
# Note: kona-rpc is NOT included to avoid rollup-boost -> reth-optimism-primitives dependency
# which causes alloy version conflicts. RPC types are defined locally in
# utils/host/src/rpc_types.rs instead.
kona-protocol = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }
kona-registry = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }
kona-genesis = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }

# hana / hokulea (Celestia/EigenDA DA backends) — not used by XLayer; excluded from workspace

# op-succinct
op-succinct-prove = { path = "scripts/prove" }
op-succinct-client-utils = { path = "utils/client" }
op-succinct-host-utils = { path = "utils/host" }
op-succinct-build-utils = { path = "utils/build" }
op-succinct-elfs = { path = "utils/elfs" }
op-succinct-validity = { path = "validity" }
op-succinct-fp = { path = "fault-proof" }
op-succinct-ethereum-client-utils = { path = "utils/ethereum/client" }
op-succinct-ethereum-host-utils = { path = "utils/ethereum/host" }
# op-succinct-celestia-*/eigenda-* excluded (not used by XLayer)
op-succinct-proof-utils = { path = "utils/proof" }
op-succinct-signer-utils = { path = "utils/signer" }
op-succinct-signer-gcp-utils = { path = "utils/signer-gcp" }
op-succinct-range-utils = { path = "programs/range/utils" }
op-succinct-bindings = { path = "bindings" }

# Alloy (Network)
alloy-signer-local = { version = "1.6.3" }
alloy-provider = { version = "1.6.3" }
alloy-transport = { version = "1.6.3" }
alloy-transport-http = { version = "1.6.3" }
alloy-contract = { version = "1.6.3" }
alloy-network = { version = "1.6.3" }

# Alloy
alloy-rlp = { version = "0.3.13", default-features = false }
alloy-trie = { version = "0.9.4", default-features = false, features = [
    "ethereum",
] }
alloy-eips = { version = "1.6.3", default-features = false }
alloy-serde = { version = "1.6.3", default-features = false }
alloy-consensus = { version = "1.6.3", default-features = false }
alloy-tx-macros = { version = "1.6.3", default-features = false }
alloy-rpc-types = { version = "1.6.3", default-features = false }
alloy-rpc-client = { version = "1.6.3", default-features = false }
alloy-node-bindings = { version = "1.6.3", default-features = false }
alloy-rpc-types-engine = { version = "1.6.3", default-features = false }
alloy-rpc-types-beacon = { version = "1.6.3", default-features = false }
alloy-rpc-types-eth = { version = "1.6.3", default-features = false }
alloy-rpc-types-trace = { version = "1.6.3", default-features = false }
alloy-signer = { version = "1.6.3", default-features = false }
alloy-signer-gcp = { version = "1.6.3", default-features = false }
alloy = { version = "1.6.3", features = [
    "reqwest",
    "network",
    "providers",
    "sol-types",
    "rpc-types",
] }

# Keccak with the SHA3 patch is more efficient than the default Keccak.
alloy-primitives = { version = "1.5.6", default-features = false, features = [
    "sha3-keccak",
] }
alloy-sol-types = { version = "1.5.6", default-features = false }
alloy-sol-macro = { version = "1.5.6", default-features = false }
alloy-chains = { version = "0.2.30", default-features = false }

# OP Alloy - from the optimism monorepo (po/gasless_v1)
op-alloy-consensus = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }
op-alloy-rpc-types = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }
op-alloy-rpc-types-engine = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }
op-alloy-network = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }

# Execution
alloy-evm = { version = "0.33.0", default-features = false }
alloy-op-evm = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }
# Use kzg-rs and substrate-bn for the zkVM.
# Versions aligned with okx/optimism po/gasless_v1 (revm 38 era)
revm = { version = "38.0.0", default-features = false, features = [
    "bn",
] }
revm-precompile = { version = "34.0.0", default-features = false }
op-revm = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1", default-features = false }

# SP1 v6.1.0 (Hypercube)
sp1-sdk = { version = "=6.1.0", features = ["network", "blocking", "profiling"] }
sp1-lib = { version = "=6.1.0", features = ["verify"] }
sp1-zkvm = { version = "=6.1.0", features = ["verify"] }
sp1-build = "=6.1.0"
sp1-prover = "=6.1.0"
sp1-prover-types = "=6.1.0"
sp1-core-executor = "=6.1.0"
sp1-hypercube = "=6.1.0"
sp1-primitives = "=6.1.0"
sp1-cluster-artifact = { git = "https://github.com/succinctlabs/sp1-cluster.git", tag = "v2.1.2" }
sp1-cluster-common = { git = "https://github.com/succinctlabs/sp1-cluster.git", tag = "v2.1.2" }
sp1-cluster-utils = { git = "https://github.com/succinctlabs/sp1-cluster.git", tag = "v2.1.2" }

# kzg
kzg-rs = { version = "0.2.8", features = ["rkyv", "serde"] }
c-kzg = { version = "2.0.0", default-features = false }

# Cloud dependencies
gcloud-sdk = { version = "0.29", default-features = false, features = ["google-cloud-kms-v1", "google-longrunning", "tls-webpki-roots"] }

[profile.release-client-lto]
inherits = "release"
panic = "abort"
codegen-units = 1
lto = "fat"

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-6.0.0" }
substrate-bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.0.0-substrate-bn" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }

# Patch sp1 crates to add gateway proxy support (only sp1-sdk is modified;
# all sp1/slop crates pinned to the same branch for version consistency)
sp1-sdk = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-build = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-core-executor = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-core-machine = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-cuda = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-curves = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-derive = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-hypercube = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-jit = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-primitives = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-prover = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-prover-types = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-recursion-circuit = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-recursion-compiler = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-recursion-executor = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-recursion-gnark-ffi = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-recursion-machine = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
sp1-verifier = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-air = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-algebra = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-alloc = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-baby-bear = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-basefold = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-basefold-prover = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-bn254 = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-challenger = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-commit = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-dft = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-fri = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-futures = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-jagged = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-keccak-air = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-koala-bear = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-matrix = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-maybe-rayon = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-merkle-tree = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-multilinear = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-poseidon2 = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-primitives = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-stacked = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-sumcheck = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-symmetric = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-tensor = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-uni-stark = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-utils = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }
slop-whir = { git = "https://github.com/okx/sp1", branch = "feat/gateway-proxy-v6.1.0" }

# Redirect crates.io op-alloy / alloy-op-evm to the optimism monorepo
# so all kona path-deps resolve to the same versions.
op-alloy-consensus = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
op-alloy-network = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
op-alloy-rpc-types = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
op-alloy-rpc-types-engine = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
op-alloy-provider = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
alloy-op-evm = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
alloy-op-hardforks = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
op-alloy = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
op-revm = { git = "https://github.com/okx/optimism", branch = "po/gasless_v1" }
