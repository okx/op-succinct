[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Exclude the Lite deploy scripts from compilation. They import the concrete
# SP1 v6.1.0 verifier (Groth16Verifier =0.8.20 + sp1-contracts' bundled OZ v5),
# which genuinely needs 0.8.20 and conflicts with the optimism contracts' exact
# =0.8.15 ("Found incompatible versions"). They're only needed to deploy the
# Lite variant — not for `forge build`, the Rust bindings' `forge bind`, or the
# E2E tests (which use SP1MockVerifier). `skip` is honored by both forge build
# and forge bind, so this fixes contracts-build and the bindings compile alike.
skip = ["script/fp/DeployOPSuccinctLite*.s.sol"]
remappings = [
    # Use openzeppelin-contracts v4.7.3 as the some contracts are not compatible with 0.8.15
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts",
    "@optimism/=lib/optimism/packages/contracts-bedrock/",
    "@forge-std/=lib/forge-std/src/",
    "@solady/=lib/solady/src",
    # Note: Use zobront/sp1-contracts as the current version for SP1 contracts is not compatible with the hard
    # version for 0.8.15 on some Optimism contracts.
    "@sp1-contracts/=lib/sp1-contracts/contracts/",
    "@rari-capital/=lib/optimism/packages/contracts-bedrock/lib/",
    # Optimism repo uses absolute imports, so we need to have remappings for the paths we use.
    "src/libraries/=lib/optimism/packages/contracts-bedrock/src/libraries/",
    "src/L1/=lib/optimism/packages/contracts-bedrock/src/L1/",
    "src/L2/=lib/optimism/packages/contracts-bedrock/src/L2/",
    "src/dispute/=lib/optimism/packages/contracts-bedrock/src/dispute/",
    "src/cannon/=lib/optimism/packages/contracts-bedrock/src/cannon/",
    "src/universal/=lib/optimism/packages/contracts-bedrock/src/universal/",
    "interfaces/=lib/optimism/packages/contracts-bedrock/interfaces/",
    "@lib-keccak/=lib/lib-keccak/contracts/lib",
]

# [lint]
# severity = ["high", "med", "low", "gas"] # Drop all "info" notes

# Enable read-write access to current directory and read access to temp directories.
# /tmp (Linux) and /var/folders (macOS) are needed for parallel sysgo-powered e2e tests
# that write config files to isolated temp directories.
fs_permissions = [
    { access = "read-write", path = "." },
    { access = "read", path = "/tmp" },
    { access = "read", path = "/var/folders" },
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
