[profile.default]
src = "contracts"
test = "tests"
script = "scripts"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 2000
ffi = false

# Default fuzz depth for iteration, smoke, review, and coverage runs across all
# stages. The authoritative Stage 5 fuzz campaign raises this once via the
# FOUNDRY_FUZZ_RUNS environment variable; do not raise the global value.
[fuzz]
runs = 256

[invariant]
runs = 500
depth = 15
