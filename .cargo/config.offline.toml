# Opt-in OFFLINE build profile — NOT the default manifest.
#
# Replaces the private `ok-kms-rust` git dependency with the local fail-fast stub so
# the workspace compiles/links without internal access. Use ONLY for offline/CI
# builds, e.g.:
#
#   cargo build -p op-succinct-config-kms --config .cargo/config.offline.toml
#
# Production reads neither this file nor the patch, so it always links the real SDK;
# the DockerfilePro `OK_KMS_STUB` guard is the backstop if the stub is ever linked.
[patch."https://gitlab.okg.com/okcoin-commons/ok-kms-rust"]
ok-kms-rust = { path = "stubs/ok-kms-rust" }
