[package]
name = "xlayer-tee-prover-mock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mock implementation of xlayer-tee-prover HTTP endpoints. For interface alignment / proposer integration testing only — does NOT generate real proofs."

[[bin]]
name = "xlayer-tee-prover-mock"
path = "src/main.rs"

[dependencies]
xlayer-tee-types.workspace = true

axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

rkyv.workspace = true
serde_json.workspace = true
uuid.workspace = true
