[package]
name = "xlayer-tee-mock-proposer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local-dev proposer mock: fetches data from a real OP devnet, generates real DefaultWitnessData via op-succinct, POSTs to tee-host. NOT a production proposer; intended for end-to-end testing while the real op-succinct fault-proof proposer is being modified."

[[bin]]
name = "xlayer-tee-mock-proposer"
path = "src/main.rs"

[dependencies]
# op-succinct integration — produces the real DefaultWitnessData
op-succinct-host-utils.workspace = true
op-succinct-ethereum-host-utils.workspace = true
op-succinct-client-utils.workspace = true

# Witness serialization
rkyv.workspace = true

# alloy types used in fetcher params
alloy-primitives.workspace = true

# HTTP client to tee-host
reqwest.workspace = true

# Async runtime + CLI + logging
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
clap = { workspace = true, features = ["derive"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
serde_json.workspace = true
