[package]
name = "xlayer-tee-mock-proposer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local-dev proposer mock: fetches data from a real OP devnet, generates witness via op-succinct, POSTs to tee-host, optionally generates an aggregation proof from the returned TEE proof. NOT a production proposer."

[[bin]]
name = "xlayer-tee-mock-proposer"
path = "src/main.rs"

[dependencies]
# op-succinct integration
op-succinct-host-utils.workspace = true
op-succinct-ethereum-host-utils.workspace = true
op-succinct-client-utils.workspace = true
op-succinct-elfs.workspace = true

# Canonical RangeJournal definition (shared with enclave + host)
xlayer-tee-types.workspace = true

# Witness + headers serialization
rkyv.workspace = true
serde_cbor.workspace = true

# SP1 prover + stdin
sp1-sdk.workspace = true

# alloy types
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-sol-types.workspace = true

# proofBytes / attestation_doc decoding
hex.workspace = true
base64.workspace = true

# HTTP client to tee-host
reqwest.workspace = true

# Async runtime + CLI + logging
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
clap = { workspace = true, features = ["derive"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
serde_json.workspace = true
