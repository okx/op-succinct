[package]
name = "test-runner"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "test-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
sp1-sdk = { version = "=5.2.4", default-features = false }
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

