[package]
name = "xlayer-tee-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "TEE proof coordination layer between proposer and Nitro Enclave"

[[bin]]
name = "xlayer-tee-host"
path = "src/main.rs"

[features]
default = []
vsock = ["dep:tokio-vsock"]

[dependencies]
xlayer-tee-types = { path = "../types" }
alloy-primitives = { workspace = true, features = ["sha3-keccak"] }
alloy-sol-types.workspace = true
tokio = { workspace = true, features = ["full"] }
axum = "0.7"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
config = { version = "0.14", default-features = false, features = ["toml"] }
dotenvy = "0.15"
uuid = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "json", "env-filter"] }
rkyv = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
bytes = "1"
clap = { workspace = true, features = ["derive", "env"] }
tokio-vsock = { version = "0.5", optional = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
